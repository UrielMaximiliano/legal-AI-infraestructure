services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-legal_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_ai} -d ${POSTGRES_DB:-legal_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: legal-ai-api
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-legal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-legal_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN:-}
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_TOKEN: ${OLLAMA_EMBEDDING_TOKEN:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-5}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT_SECONDS:-30}
      EXPORT_STORAGE_ROOT: /var/lib/legal-ai/exports
      DOCX_GENERATION_TIMEOUT_SECONDS: ${DOCX_GENERATION_TIMEOUT_SECONDS:-30}
      PDF_GENERATION_TIMEOUT_SECONDS: ${PDF_GENERATION_TIMEOUT_SECONDS:-60}
      MAX_DOCX_SIZE_BYTES: ${MAX_DOCX_SIZE_BYTES:-20971520}
      MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-31457280}
      MAX_PREVIEW_SIZE_BYTES: ${MAX_PREVIEW_SIZE_BYTES:-5242880}
      MAX_FINAL_SNAPSHOT_BYTES: ${MAX_FINAL_SNAPSHOT_BYTES:-2097152}
      MAX_EDITABLE_CONTENT_BYTES: ${MAX_EDITABLE_CONTENT_BYTES:-2097152}
      MAX_FILE_NAME_LENGTH: ${MAX_FILE_NAME_LENGTH:-120}
      MAX_RELATIVE_PATH_LENGTH: ${MAX_RELATIVE_PATH_LENGTH:-500}
      MAX_FINALIZATION_NOTES_LENGTH: ${MAX_FINALIZATION_NOTES_LENGTH:-2000}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-100}
      EXPORT_IDEMPOTENCY_WINDOW_HOURS: ${EXPORT_IDEMPOTENCY_WINDOW_HOURS:-24}
      EXPORT_FAILED_ATTEMPT_RETENTION_DAYS: ${EXPORT_FAILED_ATTEMPT_RETENTION_DAYS:-180}
      EXPORT_TEMP_RETENTION_HOURS: ${EXPORT_TEMP_RETENTION_HOURS:-24}
      EXPORT_ORPHAN_RETENTION_DAYS: ${EXPORT_ORPHAN_RETENTION_DAYS:-7}
      EXPORT_PDF_EOF_TAIL_BYTES: ${EXPORT_PDF_EOF_TAIL_BYTES:-4096}
    volumes:
      - export_storage:/var/lib/legal-ai/exports
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  export_storage:
