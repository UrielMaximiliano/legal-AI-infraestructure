[project]
name = "legal-ai-api"
version = "0.1.0"
description = "API de verificación de dependencias para legal-AI-infraestructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "httpx>=0.28.0,<1.0",
    "python-docx>=1.1.2,<2.0",
    "weasyprint>=63.0,<70.0",
]

[project.scripts]
document-exports = "legal_ai.cli.document_exports:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25.0,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9.0,<1.0",
    "mypy>=1.14.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_ai"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "contract: Contract tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/legal_ai"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
